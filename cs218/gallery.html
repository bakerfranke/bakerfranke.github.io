<div class="grid" id="grid"></div>

<script>
const sites = [
  "https://sites.google.com/view/dalereedcs218dataai/about-me",
  "https://sites.google.com/view/dorian-copo-cs-294/home",
  "https://sites.google.com/uic.edu/paulyangcs294/home"
];

const grid = document.getElementById("grid");

for (const url of sites) {
  const thumb = `https://image.thum.io/get/width/900/${encodeURIComponent(url)}`;

  const tile = document.createElement("a");
  tile.className = "tile";
  tile.href = url;
  tile.target = "_blank";
  tile.rel = "noopener noreferrer";
  tile.innerHTML = `
    <img src="${thumb}" alt="Preview of ${url}" loading="lazy">
    <div class="meta">${url}</div>
  `;
  grid.appendChild(tile);
}
</script>

<style>
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px; }
.tile { display:block; text-decoration:none; color:#111; background:#fff; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; }
.tile img { width:100%; height:220px; object-fit:cover; display:block; background:#f3f4f6; }
.meta { padding:10px 12px; font-size:13px; border-top:1px solid #e5e7eb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
